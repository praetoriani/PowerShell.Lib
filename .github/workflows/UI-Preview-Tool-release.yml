# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# =============================================================================
# ENHANCED GITHUB ACTIONS WORKFLOW FOR UI-REVIEW-TOOL RELEASES
# =============================================================================
# This file defines an automated workflow that can be triggered in two ways:
# 1. Automatically when a tag starting with "uirt-" is created (e.g. uirt-v1.02.00)
# 2. Manually through the GitHub Actions interface with custom parameters
#
# NOTE: Place this file in the repository at: .github/workflows/UI-Preview-Tool-release.yml

name: UI Preview Tool Release

# TRIGGER CONFIGURATION - MULTIPLE TRIGGERS SUPPORTED
# Defines when this workflow should be executed
on:
  # AUTOMATIC TRIGGER: Tag-based execution
  push:
    tags:
      - 'uirt-*'  # Workflow starts only for tags beginning with "uirt-"
                  # Examples: uirt-v1.02.00, uirt-v2.0.0, uirt-beta-1

  # MANUAL TRIGGER: Allows running workflow from GitHub Actions interface
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., uirt-v1.02.00)'
        required: true
        default: 'uirt-v1.02.00'
        type: string
      create_tag:
        description: 'Create the tag if it does not exist'
        required: true
        default: true
        type: boolean
      release_notes:
        description: 'Additional release notes (optional)'
        required: false
        default: ''
        type: string

# PERMISSIONS
# GitHub Actions requires explicit permission to create releases and tags
permissions:
  contents: write    # Allows creating and editing repository contents
  actions: write     # Allows workflow management

# JOB DEFINITION
# A workflow can contain multiple jobs, here we have only one
jobs:
  release:
    runs-on: ubuntu-latest    # The workflow runs on an Ubuntu Linux server

    # CONDITIONAL EXECUTION
    # Execute for uirt-tagged pushes OR manual dispatch
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/uirt-')) ||
      github.event_name == 'workflow_dispatch'

    # WORKFLOW STEPS
    # Each step is executed sequentially
    steps:
      # STEP 1: Download repository code
      # GitHub Actions runs on a fresh server and needs access to your code
      - name: Checkout repository
        uses: actions/checkout@v4    # Official GitHub Action for code download
        # After this step, all your repository files are available

      # STEP 2: Setup variables for different trigger types
      # Handle both automatic (tag push) and manual (workflow_dispatch) triggers
      - name: Setup release variables
        id: setup
        run: |
          # Determine tag name based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use user input
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            echo "Manual trigger detected"
            echo "Using tag: $TAG_NAME"
          else
            # Automatic trigger - use pushed tag
            TAG_NAME="${{ github.ref_name }}"
            echo "Automatic tag trigger detected"
            echo "Using tag: $TAG_NAME"
          fi

          # Validate tag format
          if [[ ! $TAG_NAME =~ ^uirt-.*$ ]]; then
            echo "Error: Tag name must start with 'uirt-'"
            echo "Provided: $TAG_NAME"
            exit 1
          fi

          # Export variables for later steps
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag validation successful: $TAG_NAME"

      # STEP 3: Create tag if manual trigger and tag doesn't exist
      # This step only runs for manual triggers when create_tag is enabled
      - name: Create tag if manual trigger
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create_tag == 'true'
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"

          # Configure Git with GitHub Actions bot identity
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
            echo "Continuing with existing tag..."
          else
            # Create and push new tag
            echo "Creating new tag: $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "Tag created and pushed successfully"
          fi

      # STEP 4: Create release package
      # Only the UI-Preview-Tool folder is packed into a ZIP package
      - name: Create UI-Preview-Tool release package
        run: |
          # Debug output - displayed in the Actions log
          echo "Starting release package creation for UI-Preview-Tool"

          # Create temporary folder for the release
          mkdir -p release-temp/UI-Preview-Tool
          echo "Temporary release folder created"

          # Verify source folder exists
          if [ ! -d "UI-Preview-Tool" ]; then
            echo "Error: 'UI-Preview-Tool' folder not found!"
            echo "Available folders:"
            ls -la
            exit 1
          fi

          # Copy all files from the UI-Preview-Tool folder
          cp -r "UI-Preview-Tool"/* release-temp/UI-Preview-Tool/
          echo "UI-Preview-Tool files copied:"
          ls -la "UI-Preview-Tool"/

          # Change to temporary folder
          cd release-temp

          # Create ZIP file with all UI-Preview-Tool files
          # -r = recursive (include all subdirectories)
          zip -r ../ui-preview-tool-release.zip UI-Preview-Tool/

          # Return to root directory
          cd ..

          # Confirmation and display ZIP file size
          echo "ZIP file created:"
          ls -lh ui-preview-tool-release.zip

          # Verify ZIP file contents
          echo "ZIP file contents:"
          unzip -l ui-preview-tool-release.zip

      # STEP 5: Create GitHub release with enhanced descriptions
      # This is the most important step - the actual release is created here
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v1    # Proven third-party action for releases
        with:
          # DYNAMIC TAG NAME handling for both trigger types
          tag_name: ${{ steps.setup.outputs.tag_name }}

          # RELEASE TITLE
          # Uses the tag name (e.g. "UI Preview Tool uirt-v1.02.00")
          name: UI Preview Tool ${{ steps.setup.outputs.tag_name }}

          # ENHANCED RELEASE DESCRIPTION (Markdown format supported)
          body: |
            ## File Download:

            **[`ui-preview-tool-release.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.setup.outputs.tag_name }}/ui-preview-tool-release.zip)**
            <br>

            ## Installation & Usage:
            1. Download the `ui-preview-tool-release.zip` file above
            2. Extract to your desired folder
            3. Open PowerShell
            4. Navigate to the extracted folder
            5. Run script: `.\UI-Preview-Tool.ps1`
            <br>

            ## Features:
            - Inline preview of XAML/XML files
            - Auto-reload when the file changes on disk
            - Zoom controls (fit, zoom in/out, reset to 100 %)
            - Centered preview
            - Drag & drop support
            - Recent files list with Clear History
            - Show as Window mode
            - View Code quick view
            <br>

            ## System Requirements:
            - Windows 10/11
            - PowerShell 5.1 or higher
            <br>

            ${{ github.event.inputs.release_notes != '' && format('## Additional Notes:\n{0}', github.event.inputs.release_notes) || '' }}

            ---
            *This release was automatically created by GitHub Actions.*

          # RELEASE SETTINGS
          files: ui-preview-tool-release.zip    # The ZIP file as download asset
          draft: false          # false = Release is published immediately
          prerelease: false     # false = Normal release (not marked as beta)

          # ERROR HANDLING
          fail_on_unmatched_files: true    # Workflow fails if ZIP file doesn't exist

        # AUTHENTICATION
        # GitHub Actions automatically uses GITHUB_TOKEN for authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # STEP 6: Confirm success with enhanced logging
      # Optional, but helpful for debugging and monitoring
      - name: Confirm release creation and provide usage instructions
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          TRIGGER_TYPE="${{ github.event_name }}"

          echo "UI Preview Tool release successfully created!"
          echo ""
          echo "Release Information:"
          echo "   Tag: $TAG_NAME"
          echo "   Trigger: $TRIGGER_TYPE"
          echo "   Repository: ${{ github.repository }}"
          echo "   Commit: ${{ github.sha }}"
          echo "   Created: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Release Links:"
          echo "   Release Page: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
          echo "   Direct Download: https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/ui-preview-tool-release.zip"
          echo ""
          echo "Next Steps for Users:"
          echo "   1. Visit the release page above"
          echo "   2. Download 'ui-preview-tool-release.zip'"
          echo "   3. Ignore the 'Source code' files"
          echo "   4. Extract and run"
          echo ""
          echo "For Developers:"
          if [ "$TRIGGER_TYPE" = "workflow_dispatch" ]; then
            echo "   This release was created manually via GitHub Actions"
            echo "   To create another release, go to Actions -> UI Preview Tool Release -> Run workflow"
          else
            echo "   This release was created automatically by pushing tag: $TAG_NAME"
            echo "   To create another release, push a new uirt-* tag or use manual trigger"
          fi
          echo "   Manual trigger available at: https://github.com/${{ github.repository }}/actions/workflows/UI-Preview-Tool-release.yml"
