# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# =============================================================================
# ENHANCED GITHUB ACTIONS WORKFLOW FOR ModernUI RELEASES
# =============================================================================
# This file defines an automated workflow that can be triggered in two ways:
# 1. Automatically when a tag starting with "muiapp-" is created (e.g. muiapp-v1.0.1)
# 2. Manually through the GitHub Actions interface with custom parameters

name: ModernUI Release

# UMGEBUNGSVARIABLEN. DIESE GLOBALEN VARIABLEN SIND AUSSCHLIESSLICH IM JOB-TEIL VERFÜGAR, DA DIESER DIE LAUFZEIT DARSTELLT!
# ZUGRIFF AUF DIE GLOBALEN VARIABLEN IM JOB-TEIL VIA ${{ env.VARIABLENNAME }}
env:
  APP_DEV: "Praetoriani"             # Name des Entwicklers
  APPTAGID: "muiapp-"                # Globale Variable für den Tag-Namen bzw. Tag-ID
  RUN_APP: "ModernUI.ps1"            # Das Script muss gestartet werden, um das Programm zu öffnen

# TRIGGER CONFIGURATION - MULTIPLE TRIGGERS SUPPORTED
# Defines when this workflow should be executed
on:
  # AUTOMATIC TRIGGER: Tag-based execution
  push:
    tags:
      - 'muiapp-*'  # Workflow starts only for tags beginning with "muiapp-"
                    # Examples: muiapp-v1.0.1, muiapp-v2.0.0, muiapp-beta-1
  
  # MANUAL TRIGGER: Allows running workflow from GitHub Actions interface
  workflow_dispatch:
    inputs:
      bundle_name:
        description: '📦 App Name'
        required: true
        default: 'ModernUI'
        type: string
      github_dir:
        description: '📂 Foldername inside PowerShell.Lib'
        required: true
        default: 'ModernUI'
        type: string
      tag_name:
        description: '🏷️ Tag name for the release (e.g. muiapp-v1.00.00)'
        required: true
        default: 'muiapp-v1.00.00'
        type: string
      version_number:
        description: '📋 Version Number (e.g. v1.00.00)'
        required: true
        default: 'v1.00.00'
        type: string
      release_type:
        description: '📝 Release-Type (e.g. stable release)'
        required: true
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Alpha
          - Beta
          - Hotfix
          - Bugfix
          - Final
      is_draft:
        description: '🧰 Create as Draft Release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: '📐 Mark as Pre-Release?'
        required: false
        default: false
        type: boolean
      create_tag:
        description: '🔧 Create the tag if it does not exist'
        required: true
        default: true
        type: boolean
      release_notes:
        description: '✏️ Additional release notes (optional)'
        required: false
        default: ''
        type: string
#      setup_file:
#        description: '🪄 Name of the Setup File'
#        required: false
#        default: ''
#        type: string
#      app_launcher:
#        description: '🖥️ Name of the App Launcher'
#        required: false
#        default: 'ModernUI.ps1'
#        type: string
#      notification_email:
#        description: '📧 E-Mail for Notifications'
#        required: false
#        default: 'sysdaemon.message@gmail.com'
#        type: string

# PERMISSIONS
# GitHub Actions requires explicit permission to create releases and tags
permissions:
  contents: write  # Allows creating and editing repository contents
  actions: write   # Allows workflow management
  pages: write

# JOB DEFINITION
# A workflow can contain multiple jobs, here we have only one
jobs:
  release:
    runs-on: ubuntu-latest  # The workflow runs on an Ubuntu Linux server
    
    # CONDITIONAL EXECUTION
    # Execute for muiapp-tagged pushes OR manual dispatch
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/muiapp-')) ||
      github.event_name == 'workflow_dispatch'

    # WORKFLOW STEPS
    # Each step is executed sequentially
    steps:
      # STEP 01: Download repository code
      # GitHub Actions runs on a fresh server and needs access to your code
      - name: Checkout repository
        uses: actions/checkout@v4  # Official GitHub Action for code download
        # After this step, all your repository files are available
      
      # STEP 02: This job validates some of the inputs made by the user
      # PLEASE NOTE: If the validation fails, the workflow will be stopped!
      - name: Input Validation
        id: step-input-validation
        run: |
          # First, some informative output
          echo "Validation Process started ... "
          
          # Set current validation state to true!
          VALIDATION_PASSED=true

          # Get User-Inputs and store them
          echo " → Reading user inputs"
          USERINPUT_TAGNAME=${{ github.event.inputs.tag_name }}
          USERINPUT_VERSION=${{ github.event.inputs.version_number }}
          USERINPUT_APPNAME=${{ github.event.inputs.bundle_name }}
          USERINPUT_DIRNAME=${{ github.event.inputs.github_dir }}
          echo " → Inputs were stored for validation"

          # Sanitize App Name: Remove spaces, special characters
          # Keep only: a-z, A-Z, 0-9, and hyphens (-)
          # This regex replaces everything that's NOT alphanumeric with nothing
          SANITIZED_APPNAME=$(echo "$USERINPUT_APPNAME" | sed 's/[^a-zA-Z0-9]//g')
          
          # Validate that the sanitized name is not empty
          if [ -z "$SANITIZED_APPNAME" ]; then
            echo "❌ Error: App name '$USERINPUT_APPNAME' contains only invalid characters!"
            echo "   Valid characters: a-z, A-Z, 0-9"
            #exit 1
            VALIDATION_PASSED=false
          fi
          
          # Check if name was modified
          if [ "$SANITIZED_APPNAME" != "$USERINPUT_APPNAME" ]; then
            echo "⚠️  App name sanitized:"
            echo "   Original: $USERINPUT_APPNAME"
            echo "   Sanitized: $SANITIZED_APPNAME"
          else
            echo "✅ App name is valid (no sanitization needed)"
          fi


          # Set Expression for validation
          echo " → Setting up RegEx for validation"
          VERSION_REGEX="^v([0-9]+)\.([0-9]{2})\.([0-9]{2})$"
          TAGNAME_REGEX="^muiapp-v([0-9]+)\.([0-9]{2})\.([0-9]{2})$"
          TAG_VERSION_EXP=muiapp-
          echo " → RegEx-Creation successfully finished"

          # Extract the Version-Number from the Tag-Name: muiapp-v1.00.00 -> v1.00.00
          TAG_VERSION=$(echo "${USERINPUT_TAGNAME}" | sed "s/^${TAG_VERSION_EXP}//")
          echo " → Version-Number was extracted from Tag-Name"
          
          # Set USERINPUT_APPNAME to false if it is empty
          echo " → Checking for given App Name"
          [ -z "$USERINPUT_APPNAME" ] && USERINPUT_APPNAME="false"
          
          # Set USERINPUT_DIRNAME to false if it is empty
          echo " → Checking for given Directory Name"
          [ -z "$USERINPUT_DIRNAME" ] && USERINPUT_DIRNAME="false"
          
          echo " → Validating user inputs. Please wait ..."
          echo " "
          # Validate given Version-Number
          if [[ "${USERINPUT_VERSION}" =~ ${VERSION_REGEX} ]]; then
            echo "✅ ${USERINPUT_VERSION} successfully validated"
          else
            echo "❌ Given Version-Number $USERINPUT_VERSION is not like v1.00.00"
            VALIDATION_PASSED=false
          fi
          
          # Validate given App Name
          if [ "${USERINPUT_APPNAME}" = "false" ]; then
            echo "❌ ${USERINPUT_APPNAME} is not an valid App Name"
            VALIDATION_PASSED=false
          else
            echo "✅ ${USERINPUT_APPNAME} is an valid App Name"
          fi
          
          # Validate given Directory Name
          if [ "${USERINPUT_DIRNAME}" = "false" ]; then
            echo "❌ ${USERINPUT_DIRNAME} is not a valid Directory Name"
            VALIDATION_PASSED=false
          else
            echo "✅ ${USERINPUT_DIRNAME} is a valid Directory Name"
          fi
          
          # Validate given Tag-Name
          if [[ "${USERINPUT_TAGNAME}" =~ ${TAGNAME_REGEX} ]]; then
            echo "✅ ${USERINPUT_TAGNAME} successfully validated"
          else
            echo "❌ $USERINPUT_TAGNAME is not a Tag-Name like muiapp-v1.00.00"
            VALIDATION_PASSED=false
          fi

          # Validate that both Version-Numbers are the same
          if [ "${USERINPUT_VERSION}" = "${TAG_VERSION}" ]; then
            echo "✅ Version-Number ${USERINPUT_VERSION} found in Tag-Name ${USERINPUT_TAGNAME}"
          else
            echo "❌ $USERINPUT_VERSION does not match $TAG_VERSION"
            VALIDATION_PASSED=false
          fi
          
          # Final validation
          if [ "${VALIDATION_PASSED}" = "true" ]; then
            echo "✅ Validation-Process successfully finished"
            echo "VALIDATION_PASSED=true" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ Validation-Process failed"
            echo "VALIDATION_PASSED=false" >> $GITHUB_OUTPUT
            exit 1
          fi
                    
      # STEP 03: In this step we're doing some workflow-configuration by creating some important environmental vars
      # These vars can be used after this step by using ${{ env.VARNAME }}
      - name: Performing Workflow Configuration
        id: step-workflow-config
        run: |
          # First, some informative output
          echo "Starting Workflow Configuration. Stay tuned ... "

          # Create the Build-Number and Date/Time-Stamps
          echo " → Creating Timezone"
          TZ_SHORT="Europe/Berlin"
          TIME_ZONE="$TZ_SHORT • CET"
          echo " → Creating Date/Time-Stamps"
          BUILD_DATE=$(TZ=$TZ_SHORT date +'%Y-%m-%d')
          BUILD_TIME=$(TZ=$TZ_SHORT date +'%H:%M:%S')
          BUILD_ISO=$(TZ=$TZ_SHORT date +'%Y-%m-%dT%H:%M:%S')
          UTC_TIME=$(TZ=UTC date +'%d.%m.%Y ; %H:%M:%S')
          FULL_DATETIME=$(TZ=$TZ_SHORT date '+%A, %d. %B %Y - %H:%M:%S Uhr ($TIME_ZONE)')
          echo " → Creating Build-Number"
          APP_BUILD=$(date +'%y%m%d')
          BUILD_STAMP=$(TZ=$TZ_SHORT date +'%d.%m.%Y ; %H:%M:%S')

          # Extracting Version Number from given Tag-Name
          echo " → Extracting Version-Number from provided Tag-Name"
          APPVERS_FULL="${{ github.event.inputs.version_number }}"
          APPVERS_CLEAN=$(echo "${{ github.event.inputs.tag_name }}" | sed 's/^v//')


          # Creating File- and Directory Names
          echo " → Set App-Name"
          APP_NAME=$(echo "${{ github.event.inputs.bundle_name }}" | sed 's/[^a-zA-Z0-9]//g')
          echo " → Set Release-Type"
          APP_RELTYPE="${{ github.event.inputs.release_type }}"
          echo " → Set Directory Name"
          GITHUB_DIR="${{ github.event.inputs.github_dir }}"
          echo " → Set Asset-Filenames"
          FILE_ZIP="${APP_NAME}-${APPVERS_FULL}-${APP_BUILD}.zip"
          FILE_7ZP="${APP_NAME}-${APPVERS_FULL}-${APP_BUILD}.7z"
          FILE_LOG="${APP_NAME}-${APPVERS_FULL}-${APP_BUILD}.log"
          
          # Get the user inputs for draft and prerelease
          echo " → Get user inputs for Drafts/PreRelease"
          APPMODE_DRAFT="${{ github.event.inputs.is_draft }}"
          APPMODE_PREREL="${{ github.event.inputs.is_prerelease }}"

          # Set to default value if empty
          echo " → Set default values for Drafts/PreRelease (if empty)"
          [ -z "$APPMODE_DRAFT" ] && APPMODE_DRAFT="false"
          [ -z "$APPMODE_PREREL" ] && APPMODE_PREREL="false"

          # If we have a draft → automatically set Pre-Release
          if [ "$APPMODE_DRAFT" = "true" ]; then
            APPMODE_PREREL="true"
          fi

          # Create some usefull URLs
          echo " → Creating URLs"
          GITHUB_REPO_URL="https://github.com/${{ github.repository }}/"
          GITHUB_PROJECT_URL="https://github.com/${{ github.repository }}/tree/main/${GITHUB_DIR}"
          BUNDLE_RELEASE_PAGE="https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag_name }}"
          BUNDLE_ZIP_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name }}/${FILE_ZIP}"
          BUNDLE_7ZP_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name }}/${FILE_7ZP}"
          BUNDLE_LOG_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag_name }}/${FILE_LOG}"

          # Store all the results from above as environmental vars
          echo " → Creating environmental vars for Build-Number and Date/Time-Stamps"
          echo "TZ_SHORT=$TZ_SHORT" >> $GITHUB_ENV
          echo "TIME_ZONE=$TIME_ZONE" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "BUILD_ISO=$BUILD_ISO" >> $GITHUB_ENV
          echo "UTC_TIME=$UTC_TIME" >> $GITHUB_ENV
          echo "FULL_DATETIME=$FULL_DATETIME" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          echo "BUILD_STAMP=$BUILD_STAMP" >> $GITHUB_ENV
          echo " → Creating environmental vars for Version Numbers"
          echo "APPVERS_FULL=$APPVERS_FULL" >> $GITHUB_ENV
          echo "APPVERS_CLEAN=$APPVERS_CLEAN" >> $GITHUB_ENV
          echo " → Creating environmental vars for File- and Directory Names"
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_RELTYPE=$APP_RELTYPE" >> $GITHUB_ENV
          echo "GITHUB_DIR=$GITHUB_DIR" >> $GITHUB_ENV
          echo "FILE_ZIP=$FILE_ZIP" >> $GITHUB_ENV
          echo "FILE_7ZP=$FILE_7ZP" >> $GITHUB_ENV
          echo "FILE_LOG=$FILE_LOG" >> $GITHUB_ENV
          echo " → Creating environmental vars for Drafts/PreRelease"
          echo "APPMODE_DRAFT=$APPMODE_DRAFT" >> $GITHUB_ENV
          echo "APPMODE_PREREL=$APPMODE_PREREL" >> $GITHUB_ENV
          echo " → Creating environmental vars for URLs"
          echo "GITHUB_REPO_URL=$GITHUB_REPO_URL" >> $GITHUB_ENV
          echo "GITHUB_PROJECT_URL=$GITHUB_PROJECT_URL" >> $GITHUB_ENV
          echo "BUNDLE_RELEASE_PAGE=$BUNDLE_RELEASE_PAGE" >> $GITHUB_ENV
          echo "BUNDLE_ZIP_DOWNLOAD=$BUNDLE_ZIP_DOWNLOAD" >> $GITHUB_ENV
          echo "BUNDLE_7ZP_DOWNLOAD=$BUNDLE_7ZP_DOWNLOAD" >> $GITHUB_ENV
          echo "BUNDLE_LOG_DOWNLOAD=$BUNDLE_LOG_DOWNLOAD" >> $GITHUB_ENV

          # Export vars as step output
          echo " → Exporting vars as step outputs"
          echo "tz-short=$TZ_SHORT" >> $GITHUB_OUTPUT
          echo "time-zone=$TIME_ZONE" >> $GITHUB_OUTPUT
          echo "build-date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "build-time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "build-iso=$BUILD_ISO" >> $GITHUB_OUTPUT
          echo "utc-time=$UTC_TIME" >> $GITHUB_OUTPUT
          echo "full-datetime=$FULL_DATETIME" >> $GITHUB_OUTPUT
          echo "app-build=$APP_BUILD" >> $GITHUB_OUTPUT
          echo "build-stamp=$BUILD_STAMP" >> $GITHUB_OUTPUT
          echo "appvers-full=$APPVERS_FULL" >> $GITHUB_OUTPUT
          echo "appvers-clean=$APPVERS_CLEAN" >> $GITHUB_OUTPUT
          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app-reltype=$APP_RELTYPE" >> $GITHUB_OUTPUT
          echo "github-dir=$GITHUB_DIR" >> $GITHUB_OUTPUT
          echo "file-zip=$FILE_ZIP" >> $GITHUB_OUTPUT
          echo "file-7zp=$FILE_7ZP" >> $GITHUB_OUTPUT
          echo "file-log=$FILE_LOG" >> $GITHUB_OUTPUT
          echo "appmode-draft=$APPMODE_DRAFT" >> $GITHUB_OUTPUT
          echo "appmode-prerel=$APPMODE_PREREL" >> $GITHUB_OUTPUT
          echo "github-repo-url=$GITHUB_REPO_URL" >> $GITHUB_OUTPUT
          echo "github-project-url=$GITHUB_PROJECT_URL" >> $GITHUB_OUTPUT
          echo "bundle-release-page=$BUNDLE_RELEASE_PAGE" >> $GITHUB_OUTPUT
          echo "bundle-zip-download=$BUNDLE_ZIP_DOWNLOAD" >> $GITHUB_OUTPUT
          echo "bundle-7zp-download=$BUNDLE_7ZP_DOWNLOAD" >> $GITHUB_OUTPUT
          echo "bundle-log-download=$BUNDLE_LOG_DOWNLOAD" >> $GITHUB_OUTPUT

          # Debug Output
          echo ""
          echo "📊 New Environmental vars successfully set:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  TZ_SHORT:         ${TZ_SHORT}"
          echo "  TIME_ZONE:        ${TIME_ZONE}"
          echo "  BUILD_DATE:       ${BUILD_DATE}"
          echo "  BUILD_TIME:       ${BUILD_TIME}"
          echo "  BUILD_ISO:        ${BUILD_ISO}"
          echo "  UTC_TIME:         ${UTC_TIME}"
          echo "  FULL_DATETIME:    ${FULL_DATETIME}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  APP_BUILD:        ${APP_BUILD}"
          echo "  BUILD_STAMP:      ${BUILD_STAMP}"
          echo "  APPVERS_FULL:     ${APPVERS_FULL}"
          echo "  APPVERS_CLEAN:    ${APPVERS_CLEAN}"
          echo "  APP_NAME:         ${APP_NAME}"
          echo "  APP_RELTYPE:      ${APP_RELTYPE}"
          echo "  GITHUB_DIR:       ${GITHUB_DIR}"
          echo "  FILE_ZIP:         ${FILE_ZIP}"
          echo "  FILE_7ZP:         ${FILE_7ZP}"
          echo "  FILE_LOG:         ${FILE_LOG}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  APPMODE_DRAFT:     ${GITHUB_REPO_URL}"
          echo "  APPMODE_PREREL:    ${GITHUB_REPO_URL}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  GITHUB_REPO_URL:        ${GITHUB_REPO_URL}"
          echo "  GITHUB_PROJECT_URL:     ${GITHUB_PROJECT_URL}"
          echo "  BUNDLE_RELEASE_PAGE:    ${BUNDLE_RELEASE_PAGE}"
          echo "  BUNDLE_ZIP_DOWNLOAD:    ${BUNDLE_ZIP_DOWNLOAD}"
          echo "  BUNDLE_7ZP_DOWNLOAD:    ${BUNDLE_7ZP_DOWNLOAD}"
          echo "  BUNDLE_LOG_DOWNLOAD:    ${BUNDLE_LOG_DOWNLOAD}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # STEP 04: This Step will dynamically generate the content output for the release page
      - name: Creating Content Information for the Release Page
        id: step-create-content
        run: |
          # ... to be continued ...
          echo "We're sorry, but this step isn't implemented atm."

      # STEP 05: Setup variables for different trigger types
      # Handle both automatic (tag push) and manual (workflow_dispatch) triggers
      - name: Setup release variables
        id: setup
        run: |
          # Determine tag name based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use user input
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            echo "🔧 Manual trigger detected"
            echo "📝 Using tag: $TAG_NAME"
          else
            # Automatic trigger - use pushed tag
            TAG_NAME="${{ github.ref_name }}"
            echo "🏷️ Automatic tag trigger detected"
            echo "📝 Using tag: $TAG_NAME"
          fi
          
          # Validate tag format
          if [[ ! $TAG_NAME =~ ^${{ env.APPTAGID }}.*$ ]]; then
            echo "❌ Error: Tag name must start with '${{ env.APPTAGID }}'"
            echo "❌ Provided: $TAG_NAME"
            exit 1
          fi
          
          # Export variables for later steps
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ Tag validation successful: $TAG_NAME"
      
      # STEP 06: Create tag if manual trigger and tag doesn't exist
      # This step only runs for manual triggers when create_tag is enabled
      - name: Create tag if manual trigger
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.create_tag == 'true'
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          
          # Configure Git with GitHub Actions bot identity
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists"
            echo "ℹ️ Continuing with existing tag..."
          else
            # Create and push new tag
            echo "🏷️ Creating new tag: $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
            echo "✅ Tag created and pushed successfully"
          fi
      
      # STEP 07: Create release package
      # Only the ModernUI folder is packed into a ZIP package
      - name: Create ${{ env.APP_NAME }} release package
        run: |
          # Debug output - displayed in the Actions log
          echo "🚀 Starting release package creation for ${{ env.APP_NAME }}"
          
          # Create temporary folder for the release
          mkdir -p release-temp/${{ env.APP_NAME }}
          echo "📁 Temporary release folder created"
          
          # Verify source folder exists
          if [ ! -d "${{ env.APP_NAME }}" ]; then
            echo "❌ Error: '${{ env.APP_NAME }}' folder not found!"
            echo "📂 Available folders:"
            ls -la
            exit 1
          fi
          
          # IMPORTANT: Copy all files from the ${{ env.APP_NAME }} folder
          # Folder name contains dots, but no spaces in this case
          cp -r ${{ env.APP_NAME }}/* release-temp/${{ env.APP_NAME }}/
          echo "📋 ${{ env.APP_NAME }} files copied:"
          ls -la ${{ env.APP_NAME }}/
          
          # Change to temporary folder
          cd release-temp
          
          # CREATE ZIP ARCHIVE
          # **********************************************************************
          # Create ZIP file with all ${{ env.APP_NAME }} files
          echo "🗜️ Creating ZIP Archive ..."
          # -r = recursive (include all subdirectories)
          # -q = quiet mode (less output)
          zip -r ../${{ env.FILE_ZIP }} ${{ env.APP_NAME }}/
          
          # Return to root directory
          cd ..
          
          # Confirmation and display ZIP file size
          echo "✅ ZIP file created:"
          ls -lh ${{ env.FILE_ZIP }}
          
          # Verify ZIP file contents
          echo "📦 ZIP file contents:"
          unzip -l ${{ env.FILE_ZIP }}
          # **********************************************************************


          # CREATE 7Z ARCHIVE
          # **********************************************************************
          # Create 7z file with all ${{ env.APP_NAME }} files

          # Check if 7zip is installed (usually pre-installed on ubuntu-latest)
          if ! command -v 7z &> /dev/null; then
            echo "⚠️  7z not found. Installing p7zip-full..."
            sudo apt-get update > /dev/null 2>&1
            sudo apt-get install -y p7zip-full > /dev/null 2>&1
            echo "✅ p7zip-full installed"
          fi

          # Create the 7Z archive
          # -r = recursive (include subdirectories)
          # -mx=9 = maximum compression level (0-9, 9 is highest)
          cd release-temp
          7z a -r -mx=9 ../${{ env.FILE_7ZP }} ${{ env.APP_NAME }}/
          
          # Make sure that the 7z archive was created
          if [ $? -ne 0 ]; then
            echo "❌ 7z archive creation failed!"
            exit 1
          fi
          
          # Return to root directory
          cd ..
          
          # Confirmation and display 7z file size
          echo "✅ 7z file created:"
          ls -lh ${{ env.FILE_7ZP }}
          
          # Verify 7z file contents
          echo "📦 7z file contents:"
          7z l ${{ env.FILE_7ZP }}
          # **********************************************************************


          # SUMMARY
          # **********************************************************************
          echo " "
          echo "🎉 All asset files created successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " "
          echo "📦 Archive Summary:"
          ls -lh ${{ env.FILE_ZIP }}
          ls -lh ${{ env.FILE_7ZP }}
          echo " "
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # **********************************************************************

      # STEP 08: Create GitHub release with enhanced descriptions
      # This is the most important step - the actual release is created here
      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v1  # Proven third-party action for releases
        with:
          # DYNAMIC TAG NAME handling for both trigger types
          tag_name: ${{ steps.setup.outputs.tag_name }}
          
          # RELEASE TITLE
          # Uses the tag name (e.g. "ModernUI muiapp-v1.00.10")
          # OLD STEP NAME: ${{ env.APP_NAME }} ${{ steps.setup.outputs.tag_name }}
          name: ${{ env.APP_NAME }} ${{ env.APPVERS_FULL }} (Build ${{ env.APP_BUILD }})
          
          # ENHANCED RELEASE DESCRIPTION (Markdown format supported)
          body: |
            ## 📋 General App Informations

            [![Version Number](https://img.shields.io/badge/${{ env.APPVERS_FULL }}%20(Build%3A%20${{ env.APP_BUILD }})-29a329?style=flat&label=App%20Version&labelColor=545454)](${{ env.BUNDLE_RELEASE_PAGE }})
            [![Release Type](https://img.shields.io/badge/${{ env.APP_RELTYPE }}-007acc?style=flat&label=App%20Release%3A%20&labelColor=545454)](${{ env.BUNDLE_RELEASE_PAGE }})
            
            <br>

            | Category | Information |
            |------|------|
            | 🖼️ **App Name** | ${{ env.APP_NAME }} |
            | 🔢 **App Version** | ${{ env.APPVERS_FULL }} (Build: ${{ env.APP_BUILD }}) |
            | 📦 **Release Type** | ${{ env.APP_RELTYPE }} |
            | 🗓️ **Release Date** | ${{ env.BUILD_STAMP }} (${{ env.TIME_ZONE }}) |
            | 🪛 **Developed by** | ${{ env.APP_DEV }} |
            
            <br>

            ## 💻 System Requirements

            > [!NOTE]
            > The following list/overview is a recommendation and represents an absolute minimum of system requirements that must be met to run this app

            
            ### Software            
            | Component | Requirement |
            |-----------|-------------|
            | **OS** | Windows 10/11 |
            | **PowerShell** | 7.x + (or 5.1 with .NET 4.8) |
            | **.NET Framework** | 4.8+ |
            | **Execution Policy** | RemoteSigned or Unrestricted |

            ### Hardware (Minimum)

            | Hardware | Recommended |
            |----------|-------------|
            | **CPU** | Dual-Core 2.0 GHz |
            | **RAM** | 512 MB |
            | **Disk** | ~10 MB |

            <br>

            ## ⬇️ **File Download:**
            <br>

            Click on the Badge below to start the direct download of the ZIP-File.

            [![ZIP Download](https://img.shields.io/badge/${{ env.FILE_ZIP }}-d9d9d9?style=flat&label=%F0%9F%93%A6%20Download%3A%20&labelColor=545454)](${{ env.BUNDLE_ZIP_DOWNLOAD }})

            <br>

            ## 🚀 Installation:
            1. Download the `${{ env.FILE_ZIP }}` file above
            2. Extract to your desired folder
            3. Open PowerShell and Navigate to the extracted folder
            4. Run: `.\${{ env.RUN_APP }}`
            <br>

            ## 💡 Insider tip:
            For best execution results ans user experience, I recommend creating a shortcut using the following command as the target.:
            ```
            C:\Windows\System32\conhost.exe --headless powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -NoProfile -NonInteractive -File "C:\PATH\TO\${{ env.RUN_APP }}"
            ```
            Change `-File "C:\PATH\TO\${{ env.RUN_APP }}"` to the actual location of `${{ env.RUN_APP }}`
            Save the changes, run the Shortcut and thank me later 😉
            <br>

            ${{ github.event.inputs.release_notes != '' && format('## 📝 Additional Notes: <br><br> {0} <br><br>', github.event.inputs.release_notes) || '' }}
            
            ---
            *This release was created on ${{ env.FULL_DATETIME }} using GitHub Actions.*
          
          # RELEASE SETTINGS
          files: |
            ${{ env.FILE_ZIP }}
            ${{ env.FILE_7ZP }}
          draft: ${{ env.APPMODE_DRAFT }}         # if false = Release is published immediately
          prerelease: ${{ env.APPMODE_PREREL }}   # if false = Normal release (not marked as beta)
          
          # ERROR HANDLING
          fail_on_unmatched_files: true      # Workflow fails if ZIP file doesn't exist
        
        # AUTHENTICATION
        # GitHub Actions automatically uses GITHUB_TOKEN for authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # STEP 09: Confirm success with enhanced logging
      # Optional, but helpful for debugging and monitoring
      - name: Confirm release creation and provide usage instructions
        run: |
          TAG_NAME="${{ steps.setup.outputs.tag_name }}"
          TRIGGER_TYPE="${{ github.event_name }}"
          
          echo "🎉 ${{ env.APP_NAME }}  ${{ env.APPVERS_FULL }} (Build: ${{ env.APP_BUILD }}) release successfully created!"
          echo ""
          echo "📊 Release Information:"
          echo "  ————————————————————————————————————————————————————————————————————————————————————————————————————"
          echo "  🧩 App: ${{ env.APP_NAME }}"
          echo "  🔢 Version: ${{ env.APPVERS_FULL }}"
          echo "  ⚙️ Build: ${{ env.APP_BUILD }}"
          echo "  💡 ISO Build No: ${{ env.BUILD_ISO }}"
          echo "  📦 Release Type: ${{ env.APP_RELTYPE }}"
          echo "  📐 Draft Release: ${{ env.APPMODE_DRAFT }}"
          echo "  🛠️ Pre-Release: ${{ env.APPMODE_PREREL }}"
          echo "  🪛 Developer: ${{ env.APP_DEV }}"
          echo "  🗓️ Created: ${{ env.FULL_DATETIME }}"
          echo "  🕒 UTC Time: ${{ env.UTC_TIME }}"
          echo "  ————————————————————————————————————————————————————————————————————————————————————————————————————"
          echo "  🏷️ Tag: $TAG_NAME"
          echo "  🔄 Trigger: $TRIGGER_TYPE"
          echo "  🗄️ Repository: ${{ env.GITHUB_REPO_URL }}"
          echo "  📂 Directory: ${{ env.GITHUB_PROJECT_URL }}"
          echo "  🔗 Commit: ${{ github.sha }}"
          echo "  ————————————————————————————————————————————————————————————————————————————————————————————————————"
          echo "🌐 Release Links:"
          echo "  📖 Release Page: ${{ env.BUNDLE_RELEASE_PAGE }}"
          echo "  💾 Direct Download: ${{ env.BUNDLE_ZIP_DOWNLOAD }}"
          echo "  ————————————————————————————————————————————————————————————————————————————————————————————————————"
          echo ""
          echo "🚀 Next Steps for Users:"
          echo "  1. Visit the release page above"
          echo "  2. Download '${{ env.FILE_ZIP }}'"
          echo "  4. Extract ${{ env.FILE_ZIP }}"
          echo "  5. Run PowerShell Console"
          echo "  6. Go to the extracted folder"
          echo "  7. Run the main PowerShell Script"
          echo ""
          echo "🔧 For Developers:"
          if [ "$TRIGGER_TYPE" = "workflow_dispatch" ]; then
            echo "  • This release was created manually via GitHub Actions"
            echo "  • To create another release, go to Actions → ${{ env.APP_NAME }} Release → Run workflow"
          else
            echo "  • This release was created automatically by pushing tag: $TAG_NAME"
            echo "  • To create another release, push a new ${{ env.APPTAGID }}* tag or use manual trigger"
          fi
          echo "  • Manual trigger available at: https://github.com/${{ github.repository }}/actions/workflows/${{ env.APP_NAME }}-release.yml"
          echo ""
