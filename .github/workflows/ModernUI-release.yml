            <br>

            Click on the Badges below to start the direct downloads of the desired Archive.

            [![ZIP Download](https://img.shields.io/badge/Click%20to%20Download-d9d9d9?style=flat&label=%F0%9F%93%A6%20ZIP%20Archive&labelColor=545454)](${{ env.BUNDLE_ZIP_DOWNLOAD }})
            
            [![7z Download](https://img.shields.io/badge/Click%20to%20Download-d9d9d9?style=flat&label=%F0%9F%93%A6%207z%20Archive&labelColor=545454)](${{ env.BUNDLE_7ZP_DOWNLOAD }})

            <br>

            ${{ github.event.inputs.release_notes != '' && format('## 📝 Additional Notes: <br><br> {0} <br><br>', github.event.inputs.release_notes) || '' }}
            
            ---
            *This release was created on ${{ env.FULL_DATETIME }} using GitHub Actions.*
          
